# Local development and test dependencies. Start with: docker compose up -d --wait
# These credentials are for local use only; production values come from environment variables.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: breakbread
      POSTGRES_PASSWORD: breakbread
      POSTGRES_DB: break_bread
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breakbread -d break_bread"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
